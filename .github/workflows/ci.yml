name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is the engines floor (22.18+ runs the TypeScript scripts directly); 24 is what releases use.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Versions in lockstep
        run: pnpm versions check

      - name: Build, typecheck, test
        run: pnpm check

      - name: Pack each package (dry run)
        run: |
          for dir in vanilla react vue; do
            (cd "packages/$dir" && npm pack --dry-run --json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const [p]=JSON.parse(s);console.log(`${p.name}@${p.version}: ${p.entryCount} files, ${(p.size/1024).toFixed(0)}KB packed`)})')
          done
